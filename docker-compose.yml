services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ./apps/api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      APP_USER_DSN: postgresql://app_user:${APP_USER_PASSWORD:-app_user}@db:5432/postgres
      APP_WEBHOOK_DSN: postgresql://app_webhook:${APP_WEBHOOK_PASSWORD:-app_webhook}@db:5432/postgres
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-app_user}
      APP_WEBHOOK_PASSWORD: ${APP_WEBHOOK_PASSWORD:-app_webhook}
      DEV_TOKEN_ENABLED: ${DEV_TOKEN_ENABLED:-true}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-32bytes!!}
      CRM_URL: ${CRM_URL:-http://mocks:8090/crm}
      PROVIDER_URL: ${PROVIDER_URL:-http://mocks:8090}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
