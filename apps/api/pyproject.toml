[project]
name = "call-api"
version = "0.1.0"
description = "Call campaign management API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "asyncpg>=0.30.0",
  "httpx>=0.28.0",
  "PyJWT>=2.9.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "datamodel-code-generator>=0.26.0",
  "mypy>=1.14.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "mypy>=1.14.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# FastAPI DI: Depends()/require_roles() in parameter defaults is idiomatic.
# Keep B008 elsewhere; suppress only in auth + HTTP routers for python-doctor/ruff.
[tool.ruff.lint.per-file-ignores]
"app/auth.py" = ["B008"]
"app/routers/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "app.generated.*"
ignore_errors = true

[tool.python-doctor.per-file-suppress]
"app/auth.py" = ["ruff/B008"]
"app/routers/**" = ["ruff/B008"]
